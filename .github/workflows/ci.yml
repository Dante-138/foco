name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A proteção da branch main exige este job verde para liberar o merge.
  # Trocar o nome dele exige atualizar a proteção.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions fixadas pelo hash do commit, não por tag (que pode ser reapontada).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o portão de commits compara com a branch de destino
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: nenhuma dependência roda código na instalação.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Mensagens de commit e título do PR
        if: github.event_name == 'pull_request'
        env:
          TITULO_PR: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.base_ref }}
        run: node tools/verificar-commits.mjs "$BASE"

      - name: Lint (zero avisos)
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes de unidade (100% de cobertura do núcleo)
        run: npm test

      - name: Testes de ponta a ponta (Chrome)
        run: npm run test:e2e

  # Compila o projeto Android para garantir que a casca continua montando.
  # Usa a chave de depuração do runner: este APK não é publicado. O APK assinado
  # com a chave fixa sai do build local (tools/apk.ps1).
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Copiar o app web para o projeto Android
        run: npx cap sync android

      - name: Carimbar o build (versão, commit e data em Ajustes)
        run: node tools/carimbar-build.mjs

      - name: Compilar o APK de depuração
        working-directory: android
        run: sh ./gradlew --no-daemon --console=plain assembleDebug
