<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      Política de segurança: só scripts e estilos do próprio app, nenhuma conexão
      de rede e nenhuma atribuição de HTML em texto (Trusted Types).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'"
    />
    <!-- interactive-widget=resizes-content: o teclado encolhe a página, e as folhas de edição sobem junto -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <title>Foco</title>
    <link rel="icon" type="image/svg+xml" href="icone.svg" />
    <!-- Síncrono e antes do CSS: define o tema antes do primeiro desenho -->
    <script src="js/tema-inicial.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topo">
      <h1 id="titulo"></h1>
      <button id="ajustes" class="botao-icone" type="button" aria-label="Ajustes"></button>
    </header>

    <main id="conteudo"></main>

    <button id="fab" class="fab" type="button"></button>
    <!-- Ação rápida da aba, acima do "+" (nas rotinas, desfazer). Só aparece quando a aba oferece uma. -->
    <button id="fab-secundario" class="fab secundario" type="button" hidden></button>

    <nav id="abas" class="abas" aria-label="Seções"></nav>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
